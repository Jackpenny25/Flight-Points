name: Generate Cadet PPTX

on:
  schedule:
    - cron: '0 18 * * 2,5' # Tue & Fri 18:00 UTC (adjust as needed)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate PPTX
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          mkdir -p outputs
          python scripts/generate_presentation_supabase.py --output outputs/cadets_presentation_supabase.pptx

      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadets-presentation
          path: outputs/cadets_presentation_supabase.pptx
