name: Generate Cadet PPTX

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate presentation from local data
        run: |
          mkdir -p outputs
          python scripts/generate_presentation.py --data-dir data --output outputs/cadets_presentation.pptx

      - name: Upload presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadets-presentation
          path: outputs/*.pptx

