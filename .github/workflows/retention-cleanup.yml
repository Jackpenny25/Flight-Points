name: Retention Cleanup

on:
  schedule:
    - cron: '0 3 1 * *' # At 03:00 on day-of-month 1 (monthly)
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run retention cleanup
        env:
          API_BASE_URL: ""
          RETENTION_BEARER_TOKEN: ""
        run: |
          set -e
          if [ -z "$API_BASE_URL" ] || [ -z "$RETENTION_BEARER_TOKEN" ]; then
            echo "API_BASE_URL and RETENTION_BEARER_TOKEN must be set in Secrets"
            exit 1
          fi
          URL="$API_BASE_URL/api/admin/retention/cleanup"
          echo "Calling $URL"
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RETENTION_BEARER_TOKEN" \
            -o cleanup-result.json || true
          cat cleanup-result.json
