name: Auto Deploy to Windows Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        shell: powershell
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE: /Flight-Points/

      - name: Restart Application
        shell: powershell
        run: |
          # 1. Force delete the old process if it exists (ignores errors if not found)
          pm2 delete "my-website" --exit-codes 0 2>$null | Out-Null

          # 2. Use the direct path to npm to avoid "Script Not Found" errors on Windows
          pm2 start npm --name "my-website" -- start
          
          # 3. Ensure the process list is saved for server reboots
          pm2 save
